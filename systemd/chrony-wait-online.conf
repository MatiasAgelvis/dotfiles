# Start chrony only after the network is actually usable.
#
# Without this, NTS-KE (TCP 4460) fails at boot when wifi has not associated
# yet. And because this box uses systemd-networkd (not NetworkManager), the
# dispatcher hook that normally runs `chronyc online` after a link change
# never fires — so the sources stay offline until chronyd is restarted.
[Unit]
After=network-online.target
Wants=network-online.target
