services:
  nightly:
    build:
      context: .
    image: starisk-nightly:latest
    restart: "no"
    env_file:
      - /home/matias/.config/starisk/env
    volumes:
      # Clone + page cache persist between runs; without the cache every night
      # re-fetches pages the crawler already has.
      - starisk-workspace:/workspace
      # The runner writes logs/last-run.json here; homelab-health-check reads it.
      - /home/matias/.local/state/starisk:/workspace/logs
    init: true

volumes:
  starisk-workspace:
