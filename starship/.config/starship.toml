"$schema" = 'https://starship.rs/config-schema.json'

# Use custom format
format = '''$os$username$hostname$directory $fill $all
$character'''

# right_format = ''''''

# Inserts a blank line between shell prompts
add_newline = true

[line_break]
disabled = true

# ── Top line components ───────────────────────────────────────────────────────

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](blue)"

[cmd_duration]
min_time = 0
format = "󱎫 $duration "
style = ""

[time]
disabled = false
format = '$time'
time_format = '%T'

[username]
style_user = 'bold'
style_root = 'black bold'
format = '[$user]($style)'
disabled = false
show_always = false
# aliases = { "matiasagelvis" = "MAD" }

[os]
format = "[$symbol]($style)"
style = "bold blue"
disabled = false

[directory]
read_only = " 󰌾"
truncation_length = 8
truncate_to_repo = false
before_repo_root_style = 'dimmed'
repo_root_style = 'blue bold'
format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)'

[fill]
symbol = "─"
style = "dimmed"

# ── Default prompt components ───────────────────────────────────────────────────────

